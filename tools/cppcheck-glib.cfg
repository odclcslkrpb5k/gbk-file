<?xml version="1.0"?>
<!-- What cppcheck's gtk.cfg lacks: GLib macros (without them it stops analysing the file
     that uses one, "unknownMacro"), and our own noreturn function. -->
<def format="2">
  <define name="G_GNUC_PRINTF(format_idx, arg_idx)" value=""/>
  <define name="G_GUINT64_FORMAT" value="&quot;lu&quot;"/>
  <define name="G_GINT64_FORMAT" value="&quot;li&quot;"/>
  <define name="G_GSIZE_FORMAT" value="&quot;lu&quot;"/>
  <!-- Ours: logs and aborts. Without this, cppcheck reads past it. -->
  <function name="gbk_fatal">
    <noreturn>true</noreturn>
    <formatstr type="printf"/>
    <arg nr="1"><formatstr/><not-null/></arg>
  </function>
</def>
